<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fad's Link</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3.5rem 1.25rem 2.5rem;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1a3160;
      border: 1.5px solid rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 500;
      color: #93c5fd;
      margin-bottom: 1rem;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      color: #f0f4ff;
      margin-bottom: 4px;
      letter-spacing: 0.01em;
    }

    .handle {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 2.75rem;
    }

    .links-wrapper {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #161b27;
      border: 0.5px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    .link-btn:hover {
      background: #1e2636;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #1a3160;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #60a5fa;
      font-size: 20px;
    }

    .btn-label {
      flex: 1;
    }

    .btn-title {
      font-size: 15px;
      font-weight: 500;
      color: #e8eeff;
    }

    .btn-sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
    }

    .btn-arrow {
      color: #374151;
      font-size: 16px;
    }

    footer {
      margin-top: 3rem;
      font-size: 12px;
      color: #252d3a;
    }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #161b27;
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      width: calc(100vw - 40px);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #e8eeff;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #1e2636;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: #e8eeff;
    }

    /* Arena */
    .arena {
      width: 100%;
      aspect-ratio: 1;
      background: #0f1117;
      border-radius: 14px;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #60a5fa, #1d4ed8);
      position: absolute;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.35);
    }

    .status-text {
      font-size: 11px;
      color: #374151;
      text-align: center;
    }

    /* Tilt display */
    .tilt-row {
      display: flex;
      gap: 10px;
    }

    .tilt-chip {
      flex: 1;
      background: #0f1117;
      border-radius: 10px;
      border: 0.5px solid rgba(255, 255, 255, 0.06);
      padding: 8px 10px;
      text-align: center;
    }

    .tilt-label {
      font-size: 10px;
      color: #4b5563;
      margin-bottom: 2px;
    }

    .tilt-value {
      font-size: 13px;
      font-weight: 500;
      color: #60a5fa;
    }
  </style>
</head>
<body>

  <div class="avatar">F</div>
  <p class="name">Fad</p>
  <p class="handle">@fad</p>

  <div class="links-wrapper">
    <div class="link-btn" id="btn1">
      <div class="btn-icon"><i class="ti ti-cloud" aria-hidden="true"></i></div>
      <div class="btn-label">
        <div class="btn-title">Cloud Storage</div>
        <div class="btn-sub">Access my files</div>
      </div>
      <i class="ti ti-chevron-right btn-arrow" aria-hidden="true"></i>
    </div>

    <div class="link-btn" id="btn2">
      <div class="btn-icon"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i></div>
      <div class="btn-label">
        <div class="btn-title">Control</div>
        <div class="btn-sub">Open control panel</div>
      </div>
      <i class="ti ti-chevron-right btn-arrow" aria-hidden="true"></i>
    </div>

    <div class="link-btn" id="btn-accel">
      <div class="btn-icon"><i class="ti ti-3d-rotate" aria-hidden="true"></i></div>
      <div class="btn-label">
        <div class="btn-title">Accelerometer test</div>
        <div class="btn-sub">Tilt your device to roll the ball</div>
      </div>
      <i class="ti ti-chevron-right btn-arrow" aria-hidden="true"></i>
    </div>
  </div>

  <footer>fad's links</footer>

  <!-- Accelerometer Modal -->
  <div class="modal-overlay" id="accel-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Accelerometer test</span>
        <button class="modal-close" id="modal-close"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>

      <div class="arena" id="arena">
        <div class="ball" id="ball"></div>
      </div>

      <div class="tilt-row">
        <div class="tilt-chip">
          <div class="tilt-label">X (left / right)</div>
          <div class="tilt-value" id="val-x">0.00</div>
        </div>
        <div class="tilt-chip">
          <div class="tilt-label">Y (fwd / back)</div>
          <div class="tilt-value" id="val-y">0.00</div>
        </div>
        <div class="tilt-chip">
          <div class="tilt-label">Z (up / down)</div>
          <div class="tilt-value" id="val-z">0.00</div>
        </div>
      </div>

      <p class="status-text" id="status-text">Tap the arena to request sensor permission…</p>
    </div>
  </div>

  <script>
    let link1 = "", link2 = "";

    fetch("https://mihddrl-default-rtdb.asia-southeast1.firebasedatabase.app/Links.json")
      .then(r => r.text())
      .then(text => {
        const m1 = text.match(/Link1:\s*([^|"\s]+)/);
        if (m1) {
          link1 = m1[1].trim();
          if (!link1.startsWith("http")) link1 = "https://" + link1;
        }
        const m2 = text.match(/Link2:\s*([^|"\s]+)/);
        if (m2) {
          link2 = m2[1].trim();
          if (!link2.startsWith("http")) link2 = "https://" + link2;
        }
      });

    document.getElementById("btn1").onclick = () => { if (link1) location.href = link1; };
    document.getElementById("btn2").onclick = () => { if (link2) location.href = link2; };

    // --- Accelerometer ---
    const modal  = document.getElementById("accel-modal");
    const arena  = document.getElementById("arena");
    const ball   = document.getElementById("ball");
    const valX   = document.getElementById("val-x");
    const valY   = document.getElementById("val-y");
    const valZ   = document.getElementById("val-z");
    const status = document.getElementById("status-text");

    let bx = 50, by = 50;
    let vx = 0, vy = 0;
    let ax = 0, ay = 0;
    let listening = false;
    let raf;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function physicsLoop() {
      const w = arena.clientWidth;
      const h = arena.clientHeight;
      const r = 18;

      vx += ax * 0.6;
      vy += ay * 0.6;
      vx *= 0.88;
      vy *= 0.88;

      bx = clamp(bx + vx, r, w - r);
      by = clamp(by + vy, r, h - r);

      if (bx <= r || bx >= w - r) vx *= -0.4;
      if (by <= r || by >= h - r) vy *= -0.4;

      ball.style.left = bx + "px";
      ball.style.top  = by + "px";

      raf = requestAnimationFrame(physicsLoop);
    }

    function startPhysics() {
      if (raf) cancelAnimationFrame(raf);
      const w = arena.clientWidth;
      const h = arena.clientHeight;
      bx = w / 2;
      by = h / 2;
      raf = requestAnimationFrame(physicsLoop);
    }

    function onMotion(e) {
      const g = e.accelerationIncludingGravity || e.acceleration;
      if (!g) return;
      const gx = g.x || 0;
      const gy = g.y || 0;
      const gz = g.z || 0;

      ax =  gx * 0.5;
      ay = -gy * 0.5;

      valX.textContent = gx.toFixed(2);
      valY.textContent = gy.toFixed(2);
      valZ.textContent = gz.toFixed(2);
    }

    async function requestSensor() {
      if (listening) return;
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        try {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm === "granted") {
            window.addEventListener("devicemotion", onMotion);
            listening = true;
            status.textContent = "Tilt your device to roll the ball!";
          } else {
            status.textContent = "Permission denied — sensor unavailable.";
          }
        } catch (err) {
          status.textContent = "Could not get sensor permission.";
        }
      } else if (typeof DeviceMotionEvent !== "undefined") {
        window.addEventListener("devicemotion", onMotion);
        listening = true;
        status.textContent = "Tilt your device to roll the ball!";
      } else {
        status.textContent = "DeviceMotion not supported on this device.";
      }
    }

    document.getElementById("btn-accel").onclick = () => {
      modal.classList.add("open");
      requestSensor();
      setTimeout(startPhysics, 50);
    };

    document.getElementById("modal-close").onclick = () => {
      modal.classList.remove("open");
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    };

    modal.addEventListener("click", e => {
      if (e.target === modal) {
        modal.classList.remove("open");
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      }
    });

    arena.addEventListener("click", requestSensor);
  </script>
</body>
</html>
