<!DOCTYPE html>
<html>
<body>
<script>
fetch("https://mihddrl-default-rtdb.asia-southeast1.firebasedatabase.app/Links.json")
  .then(r => r.json())
  .then(baseUrl => {
    // ambil path setelah domain, misalnya /share/jjPsO_BrDf3xNJzlkmfqmw
    const path = window.location.pathname;

    // gabungkan base URL dari Firebase + path
    const target = baseUrl.replace(/\/$/, "") + path;

    location.href = target;
  });
</script>
</body>
</html>
