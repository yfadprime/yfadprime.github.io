<!DOCTYPE html>
<html>
<head><title>Redirecting...</title></head>
<body>
<script>
  fetch("https://mihddrl-default-rtdb.asia-southeast1.firebasedatabase.app/Links.json")
    .then(r => r.text())
    .then(text => {
      const parts = window.location.pathname.match(/^\/link(\d+)(\/.*)?$/);
      if (!parts) return;

      const num = parts[1];
      const rest = parts[2] || "";

      const match = text.match(new RegExp("Link" + num + ":\\s*([^|\"\\s]+)"));
      if (match) {
        let base = match[1].trim();
        if (!base.startsWith("http")) base = "https://" + base;
        window.location.href = base.replace(/\/$/, "") + rest;
      }
    });
</script>
</body>
</html>
